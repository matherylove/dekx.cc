<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
function nearest(P,K,r,g,b){
  let best=0,bd=Infinity;
  for(let j=0,o=0;j<K;j++,o+=3){
    const pr=P[o],pg=P[o+1],pb=P[o+2];
    const rm=(r+pr)*0.5,dr=r-pr,dg=g-pg,db=b-pb;
    const d=(2+rm/256)*dr*dr+4*dg*dg+(2+(255-rm)/256)*db*db;
    if(d<bd){bd=d;best=j}
  }
  return best;
}

function buildHist(d,N){
  const BINS=262144;
  const cnt=new Uint32Array(BINS),sr=new Float64Array(BINS),sg=new Float64Array(BINS),sb=new Float64Array(BINS);
  let exact=new Map(),total=0;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]<128)continue;
    const r=d[i],g=d[i+1],b=d[i+2];
    const k=((r>>2)<<12)|((g>>2)<<6)|(b>>2);
    cnt[k]++;sr[k]+=r;sg[k]+=g;sb[k]+=b;total++;
    if(exact){const ek=(r<<16)|(g<<8)|b;exact.set(ek,(exact.get(ek)||0)+1);if(exact.size>N)exact=null}
  }
  let nb=0;for(let k=0;k<BINS;k++)if(cnt[k])nb++;
  const R=new Float32Array(nb),G=new Float32Array(nb),B=new Float32Array(nb),Wt=new Float32Array(nb);
  for(let k=0,i=0;k<BINS;k++){const c=cnt[k];if(c){R[i]=sr[k]/c;G[i]=sg[k]/c;B[i]=sb[k]/c;Wt[i]=c;i++}}
  return {nb,R,G,B,Wt,total,exact:exact?[...exact.keys()].map(k=>[k>>16,(k>>8)&255,k&255]):null};
}

function makeBox(idx,h){
  let mn=[255,255,255],mx=[0,0,0],w=0;
  for(const i of idx){
    const v=[h.R[i],h.G[i],h.B[i]];
    for(let c=0;c<3;c++){if(v[c]<mn[c])mn[c]=v[c];if(v[c]>mx[c])mx[c]=v[c]}
    w+=h.Wt[i];
  }
  const rng=[(mx[0]-mn[0])*1.0,(mx[1]-mn[1])*1.2,(mx[2]-mn[2])*0.9];
  let ch=0;if(rng[1]>rng[ch])ch=1;if(rng[2]>rng[ch])ch=2;
  return {idx,w,ch,range:rng[ch]};
}
function medianCut(h,N){
  const all=new Array(h.nb);for(let i=0;i<h.nb;i++)all[i]=i;
  const boxes=[makeBox(all,h)];
  const chan=[h.R,h.G,h.B];
  while(boxes.length<N){
    let bi=-1,bs=0;
    for(let i=0;i<boxes.length;i++){const b=boxes[i];if(b.idx.length<2)continue;const s=b.range*Math.sqrt(b.w);if(s>bs){bs=s;bi=i}}
    if(bi<0)break;
    const b=boxes[bi],A=chan[b.ch];
    b.idx.sort((x,y)=>A[x]-A[y]);
    let acc=0,half=b.w/2,s=1;
    for(let i=0;i<b.idx.length;i++){acc+=h.Wt[b.idx[i]];if(acc>=half){s=i+1;break}}
    s=Math.max(1,Math.min(b.idx.length-1,s));
    boxes.splice(bi,1,makeBox(b.idx.slice(0,s),h),makeBox(b.idx.slice(s),h));
  }
  const P=new Float32Array(boxes.length*3);
  boxes.forEach((b,j)=>{let r=0,g=0,bl=0;for(const i of b.idx){const w=h.Wt[i];r+=h.R[i]*w;g+=h.G[i]*w;bl+=h.B[i]*w}P[j*3]=r/b.w;P[j*3+1]=g/b.w;P[j*3+2]=bl/b.w});
  return P;
}
function kmeans(h,P,iters){
  const K=P.length/3;
  for(let it=0;it<iters;it++){
    const s=new Float64Array(K*4);
    for(let i=0;i<h.nb;i++){const j=nearest(P,K,h.R[i],h.G[i],h.B[i]),w=h.Wt[i];s[j*4]+=h.R[i]*w;s[j*4+1]+=h.G[i]*w;s[j*4+2]+=h.B[i]*w;s[j*4+3]+=w}
    for(let j=0;j<K;j++){const w=s[j*4+3];if(w>0){P[j*3]=s[j*4]/w;P[j*3+1]=s[j*4+1]/w;P[j*3+2]=s[j*4+2]/w}}
  }
  return P;
}
function autoPalette(h,N){
  if(h.exact){const P=new Float32Array(h.exact.length*3);h.exact.forEach((c,j)=>{P[j*3]=c[0];P[j*3+1]=c[1];P[j*3+2]=c[2]});return P}
  const P=kmeans(h,medianCut(h,N),h.nb>60000?3:5);
  for(let i=0;i<P.length;i++)P[i]=Math.round(P[i]);
  return P;
}
function fixedPalette(h,hexes,N){
  const F=new Float32Array(hexes.length*3);
  hexes.forEach((x,j)=>{const v=parseInt(x,16);F[j*3]=v>>16;F[j*3+1]=(v>>8)&255;F[j*3+2]=v&255});
  const FK=hexes.length;
  if(N>=FK||h.nb===0)return F;
  // weight each palette entry by how much of the picture lands on it,
  // then cluster those entries and keep one representative per cluster
  const use=new Float64Array(FK);
  for(let i=0;i<h.nb;i++)use[nearest(F,FK,h.R[i],h.G[i],h.B[i])]+=h.Wt[i];
  const live=[];for(let j=0;j<FK;j++)if(use[j]>0)live.push(j);
  const chosen=new Set();
  if(live.length<=N)live.forEach(j=>chosen.add(j));
  else{
    const L=live.length,LP=new Float32Array(L*3);
    const hp={nb:L,R:new Float32Array(L),G:new Float32Array(L),B:new Float32Array(L),Wt:new Float32Array(L),exact:null};
    live.forEach((j,k)=>{hp.R[k]=LP[k*3]=F[j*3];hp.G[k]=LP[k*3+1]=F[j*3+1];hp.B[k]=LP[k*3+2]=F[j*3+2];hp.Wt[k]=use[j]});
    const C=kmeans(hp,medianCut(hp,N),6);
    for(let c=0;c<C.length/3;c++)chosen.add(live[nearest(LP,L,C[c*3],C[c*3+1],C[c*3+2])]);
  }
  if(chosen.size<N){
    const order=[...use.keys()].sort((a,b)=>use[b]-use[a]);
    for(const j of order){if(chosen.size>=N)break;chosen.add(j)}
  }
  const ids=[...chosen],P=new Float32Array(ids.length*3);
  ids.forEach((j,k)=>{P[k*3]=F[j*3];P[k*3+1]=F[j*3+1];P[k*3+2]=F[j*3+2]});
  return P;
}

function bayer(n){
  let m=[[0]];
  while(m.length<n){const s=m.length,M=[];for(let y=0;y<s*2;y++){const row=[];for(let x=0;x<s*2;x++){const q=[0,2,3,1][(y>=s?2:0)+(x>=s?1:0)];row.push(m[y%s][x%s]*4+q)}M.push(row)}m=M}
  return m;
}
const KERNELS={
  fs:[[1,0,7/16],[-1,1,3/16],[0,1,5/16],[1,1,1/16]],
  atkinson:[[1,0,1/8],[2,0,1/8],[-1,1,1/8],[0,1,1/8],[1,1,1/8],[0,2,1/8]]
};

function mapPixels(d,w,h,P,mode,strength){
  const K=P.length/3,out=new Uint8ClampedArray(d.length),used=new Uint32Array(K),idx=new Int16Array(w*h).fill(-1);
  let lookup;
  if(mode==="none"){
    const cache=new Map();
    lookup=(r,g,b)=>{const k=(r<<16)|(g<<8)|b;let j=cache.get(k);if(j===undefined){j=nearest(P,K,r,g,b);cache.set(k,j)}return j};
  }else{
    const t=new Int16Array(262144).fill(-1);
    lookup=(r,g,b)=>{const k=((r>>2)<<12)|((g>>2)<<6)|(b>>2);let j=t[k];if(j<0){j=nearest(P,K,(r&252)|2,(g&252)|2,(b&252)|2);t[k]=j}return j};
  }
  const put=(i,j)=>{out[i]=P[j*3];out[i+1]=P[j*3+1];out[i+2]=P[j*3+2];out[i+3]=255;used[j]++;idx[i>>2]=j};

  if(mode==="none"){
    for(let i=0;i<d.length;i+=4){if(d[i+3]<128)continue;put(i,lookup(d[i],d[i+1],d[i+2]))}
  }else if(mode==="bayer4"||mode==="bayer8"){
    const n=mode==="bayer4"?4:8,M=bayer(n),nn=n*n;
    const spread=(255/Math.max(1,Math.cbrt(K)-0.5))*strength;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;if(d[i+3]<128)continue;
      const o=((M[y%n][x%n]+0.5)/nn-0.5)*spread;
      const r=Math.max(0,Math.min(255,d[i]+o|0)),g=Math.max(0,Math.min(255,d[i+1]+o|0)),b=Math.max(0,Math.min(255,d[i+2]+o|0));
      put(i,lookup(r,g,b));
    }
  }else{
    const ker=KERNELS[mode],RW=(w+4)*3;
    let rows=[new Float32Array(RW),new Float32Array(RW),new Float32Array(RW)];
    for(let y=0;y<h;y++){
      const ltr=(y&1)===0,cur=rows[0];
      for(let s=0;s<w;s++){
        const x=ltr?s:w-1-s,i=(y*w+x)*4,e=(x+2)*3;
        if(d[i+3]<128)continue;
        const r=Math.max(0,Math.min(255,d[i]+cur[e])),g=Math.max(0,Math.min(255,d[i+1]+cur[e+1])),b=Math.max(0,Math.min(255,d[i+2]+cur[e+2]));
        const j=lookup(r|0,g|0,b|0);put(i,j);
        const er=(r-P[j*3])*strength,eg=(g-P[j*3+1])*strength,eb=(b-P[j*3+2])*strength;
        for(const [dx,dy,f] of ker){
          const xx=x+(ltr?dx:-dx);if(xx<0||xx>=w)continue;
          const row=rows[dy],o=(xx+2)*3;row[o]+=er*f;row[o+1]+=eg*f;row[o+2]+=eb*f;
        }
      }
      const r0=rows[0];r0.fill(0);rows=[rows[1],rows[2],r0];
    }
  }
  return {out,used,idx};
}


function drawResized(bmp,sw,sh,tw,th,smooth,keepAlpha,bg){
  let cur=bmp,cw=sw,ch=sh;
  if(smooth){ // step down by halves for clean large reductions
    while(cw/2>=tw&&ch/2>=th){
      const nw=Math.max(tw,Math.round(cw/2)),nh=Math.max(th,Math.round(ch/2));
      const c=document.createElement("canvas");c.width=nw;c.height=nh;
      const x=c.getContext("2d");x.imageSmoothingEnabled=true;x.imageSmoothingQuality="high";x.drawImage(cur,0,0,nw,nh);
      cur=c;cw=nw;ch=nh;
    }
  }
  const c=document.createElement("canvas");c.width=tw;c.height=th;
  const x=c.getContext("2d",{willReadFrequently:true});
  if(!keepAlpha){x.fillStyle=bg;x.fillRect(0,0,tw,th)}
  x.imageSmoothingEnabled=smooth;x.imageSmoothingQuality="high";
  x.drawImage(cur,0,0,tw,th);
  return c;
}

function parseHexes(text){
  const out=[],seen=new Set();
  const re=/#?\b([0-9a-f]{6}|[0-9a-f]{3})\b/gi;let m;
  while((m=re.exec(text))){
    let h=m[1];if(h.length===3)h=h.split("").map(c=>c+c).join("");
    h=h.toUpperCase();if(!seen.has(h)){seen.add(h);out.push(h)}
  }
  return out;
}
function currentFixed(){
  if(palId==="custom")return parseHexes($("custom").value);
  const p=PRESETS.find(x=>x[0]===palId);return p&&p[2]?p[2].map(h=>h.replace("#","").toUpperCase()):null;
}

async function loadFile(file){
  if(!file)return;
  if(file.type && !file.type.startsWith("image/")){setStatusText("That file isn't an image. Choose a PNG, JPG, GIF or WebP.");return}
  let bmp=null;
  try{bmp=await createImageBitmap(file)}catch(e){
    try{bmp=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
    catch(e2){setStatusText("This image couldn't be opened. Try saving it as PNG or JPG first.");return}
  }
  const w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight;
  src={bmp,w,h,name:(file.name||"image").replace(/\.[^.]+$/,"")};
  $("srcInfo").textContent=`${file.name||"Pasted image"} (${w}×${h})`;
  $("empty").hidden=true;
  setPixelSize(k);
}

/* ---------- Adjustments ---------- */
function adjust(d){
  const b=+$("bri").value,c=+$("con").value,s=+$("sat").value/100,hdeg=+$("hue").value;
  if(!b&&!c&&s===1&&!hdeg)return;
  const cf=(259*(c*2.55+255))/(255*(259-c*2.55)),bo=b*1.28;
  const th=hdeg*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0)continue;
    let r=d[i],g=d[i+1],bl=d[i+2];
    if(hdeg){ // rotate hue in YIQ space
      const y=.299*r+.587*g+.114*bl,ii=.596*r-.274*g-.322*bl,q=.211*r-.523*g+.312*bl;
      const i2=ii*cs-q*sn,q2=ii*sn+q*cs;
      r=y+.956*i2+.621*q2;g=y-.272*i2-.647*q2;bl=y-1.106*i2+1.703*q2;
    }
    if(s!==1){const L=.299*r+.587*g+.114*bl;r=L+(r-L)*s;g=L+(g-L)*s;bl=L+(bl-L)*s}
    if(c){r=cf*(r-128)+128;g=cf*(g-128)+128;bl=cf*(bl-128)+128}
    d[i]=r+bo;d[i+1]=g+bo;d[i+2]=bl+bo;
  }
}
function erode(d,w,h,passes){
  for(let p=0;p<passes;p++){
    const c=d.slice();
    const lum=i=>c[i]*.299+c[i+1]*.587+c[i+2]*.114;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;if(c[i+3]<128)continue;
      let best=i,bl=lum(i);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=w||yy>=h)continue;
        const j=(yy*w+xx)*4;if(c[j+3]<128)continue;const l=lum(j);if(l<bl){bl=l;best=j}
      }
      d[i]=c[best];d[i+1]=c[best+1];d[i+2]=c[best+2];
    }
  }
}

/* ---------- Base pass: resize, adjust, quantize ---------- */
async function processBase(){
  const t0=performance.now();
  const tw=clampDim(W.value),th=clampDim(H.value);
  if(tw*th*k*k>MAX_OUT){setStatusText(`Output would be ${tw*k}×${th*k}, over 16 megapixels. Pick a smaller pixel grid or pixel size.`);return false}
  let N=Math.max(2,Math.min(256,Math.round(+$("n").value||16)));
  const keepAlpha=$("keepAlpha").checked,smooth=$("resize").value==="smooth";
  const baseC=drawResized(src.bmp,src.w,src.h,tw,th,smooth,keepAlpha,$("bg").value);
  const og=$("orig");og.width=tw;og.height=th;const ogx=og.getContext("2d");ogx.clearRect(0,0,tw,th);ogx.drawImage(baseC,0,0);
  const d=baseC.getContext("2d").getImageData(0,0,tw,th).data;
  // work in a float copy so adjustments don't clip early
  const wd=new Float32Array(d.length);for(let i=0;i<d.length;i++)wd[i]=d[i];
  adjust(wd);
  const cd=new Uint8ClampedArray(wd);
  const ero=+$("ero").value;if(ero)erode(cd,tw,th,ero);
  const hist=buildHist(cd,N);
  let P;
  if(palId!=="auto"){
    const fx=currentFixed();
    if(!fx||fx.length<2){setStatusText("Add at least 2 hex colors to the custom palette.");return false}
    P=fixedPalette(hist,fx,N);
  }else P=autoPalette(hist,N);
  const mode=$("dither").value,strength=+$("strength").value/100;
  const K=P.length/3;
  const m=hist.total?mapPixels(cd,tw,th,P,mode,strength):{used:new Uint32Array(K),idx:new Int16Array(tw*th).fill(-1)};
  const order=[...Array(K).keys()].sort((a,b)=>(P[a*3]*.299+P[a*3+1]*.587+P[a*3+2]*.114)-(P[b*3]*.299+P[b*3+1]*.587+P[b*3+2]*.114));
  const rank=new Int16Array(K);order.forEach((j,r)=>rank[j]=r);
  const grid=document.createElement("canvas");grid.width=tw;grid.height=th;
  base={gw:tw,gh:th,k,P,K,idx:m.idx,used:m.used,order,rank,total:hist.total,grid,gimg:new ImageData(tw,th),ms:performance.now()-t0};
  return true;
}

const DLG={
  classic:{bg:["#000000"],border:"#FFFFFF",kind:"double",text:"#FFFFFF"},
  blue:{bg:["#2B3FB8","#0B1450"],border:"#FFFFFF",kind:"double",text:"#FFFFFF"},
  terminal:{bg:["#000000"],border:"#33FF66",kind:"single",text:"#33FF66",prompt:"> "},
  parchment:{bg:["#E9D7AC"],border:"#5A3A1E",kind:"thick",text:"#3A2412"},

let fontReady=null;
function ensureFont(){
  if(!fontReady)fontReady=(document.fonts&&document.fonts.load?document.fonts.load('16px "DotGothic16"').catch(()=>{}):Promise.resolve());

}
function frameRect(c,x,y,w,h,t){c.fillRect(x,y,w,t);c.fillRect(x,y+h-t,w,t);c.fillRect(x,y,t,h);c.fillRect(x+w-t,y,t,h)}
function crispText(dw,dh,lines,color,font){
  const t=document.createElement("canvas");t.width=dw;t.height=dh;const c=t.getContext("2d");
  c.font=font;c.textBaseline="top";c.fillStyle=color;
  lines.forEach(([s,x,y])=>c.fillText(s,x,y));
  const im=c.getImageData(0,0,dw,dh),d=im.data;
  for(let i=3;i<d.length;i+=4)d[i]=d[i]>=110?255:0;

}
function wrap(c,text,maxW){
  const out=[];

    let line="";
    for(const word of para.split(/(\s+)/)){
      if(!word)continue;
      const test=line+word;
      if(c.measureText(test).width<=maxW||!line.trim()){
        if(c.measureText(test).width>maxW){ // single long word: break by characters
          for(const ch of word){if(c.measureText(line+ch).width>maxW&&line){out.push(line);line=""}line+=ch}
        }else line=test;
      }else{out.push(line.trimEnd());line=word.trimStart()}
    }
    out.push(line.trimEnd());
  }

}
function buildDialog(outW,outH){
  dlgLayer=null;

  const u=Math.max(1,Math.round(outW/target)),dw=Math.floor(outW/u),dh=Math.floor(outH/u);

  const name=$("dlgName").value.trim();

  if(dw<120||dh<boxH+m*2+nameH){$("saveHint").textContent="The picture is too small for a dialog box at this text size. Try Small text or a bigger output.";return}
  const cv=document.createElement("canvas");cv.width=dw;cv.height=dh;const c=cv.getContext("2d");
  const pos=$("dlgPos").value;
  const x=m,y=pos==="top"?m+nameH:pos==="middle"?Math.round((dh-boxH+nameH)/2):dh-m-boxH;
  const fill=(bx,by,bw,bh)=>{
    if(st.bg.length>1){const g=c.createLinearGradient(0,by,0,by+bh);g.addColorStop(0,st.bg[0]);g.addColorStop(1,st.bg[1]);c.fillStyle=g}else c.fillStyle=st.bg[0];

    c.fillStyle=st.border;
    if(st.kind==="double"){frameRect(c,bx,by,bw,bh,1);frameRect(c,bx+2,by+2,bw-4,bh-4,1)}
    else if(st.kind==="thick")frameRect(c,bx,by,bw,bh,2);

    c.clearRect(bx,by,1,1);c.clearRect(bx+bw-1,by,1,1);c.clearRect(bx,by+bh-1,1,1);c.clearRect(bx+bw-1,by+bh-1,1,1);
  };
  c.font=font;
  const texts=[];
  if(name){
    const nw=Math.min(boxW-20,Math.ceil(c.measureText(name).width)+16),nx=x+8,ny=y-nameH+1;

  }

  const raw=(st.prompt||"")+$("dlgText").value;
  const lines=wrap(c,raw,boxW-pad*2-14).slice(0,3);
  lines.forEach((s,i)=>texts.push([s,x+pad+2,y+pad+i*lineH]));
  c.drawImage(crispText(dw,dh,texts,st.text,font),0,0);
  if($("dlgArrow").checked){
    c.fillStyle=st.text;const ax=x+boxW-pad-9,ay=y+boxH-pad-6;
    if(dlgStyle==="terminal")c.fillRect(ax+1,ay-4,6,9);

/* ---------- FX ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const val=id=>+$("fx-"+id).value/100;
function fxGhost(d,w,h,a,kk){
  const c=d.slice(),al=a*.55,dx=Math.max(kk*2,Math.round(w*.02)),dy=Math.max(0,Math.round(kk*0.5));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const sx=x-dx,sy=y-dy;if(sx<0||sy<0)continue;
    const i=(y*w+x)*4,j=(sy*w+sx)*4;if(c[j+3]<128||d[i+3]<128)continue;
    for(let ch=0;ch<3;ch++){const v=c[i+ch]*(1-al)+c[j+ch]*al;if(v>d[i+ch])d[i+ch]=v}
  }
}
function fxRGB(d,w,h,a,kk){
  const c=d.slice(),s=Math.max(1,Math.round(a*kk*2.5));
  for(let y=0;y<h;y++){const row=y*w;
    for(let x=0;x<w;x++){const i=(row+x)*4;if(d[i+3]<128)continue;
      const xr=Math.min(w-1,x+s),xb=Math.max(0,x-s);
      d[i]=c[(row+xr)*4];d[i+2]=c[(row+xb)*4+2];
    }}
}
function fxGlitch(d,w,h,a,kk,sd){
  const r=rng(sd),c=d.slice(),n=3+Math.round(a*14);
  for(let s=0;s<n;s++){
    const y0=(r()*h)|0,bh=Math.max(kk,(r()*h*.06*(.4+a))|0);
    const dx=Math.round(((r()-.5)*w*.18*a)/kk)*kk,split=r()<.5?Math.max(kk,Math.round(kk*2*a)):0;
    for(let y=y0;y<Math.min(h,y0+bh);y++){const row=y*w;
      for(let x=0;x<w;x++){
        const sx=((x-dx)%w+w)%w,i=(row+x)*4,j=(row+sx)*4;
        d[i]=c[((row+Math.min(w-1,sx+split)))*4];d[i+1]=c[j+1];d[i+2]=c[j+2];d[i+3]=c[j+3];
      }}
  }
  const blocks=Math.round(a*5);
  for(let b=0;b<blocks;b++){
    const bw=Math.max(kk*2,(r()*w*.2)|0),bh=Math.max(kk*2,(r()*h*.05)|0);
    const sx=(r()*(w-bw))|0,sy=(r()*(h-bh))|0,tx=(r()*(w-bw))|0,ty=(r()*(h-bh))|0;
    for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){const i=((ty+y)*w+tx+x)*4,j=((sy+y)*w+sx+x)*4;d[i]=c[j];d[i+1]=c[j+1];d[i+2]=c[j+2];d[i+3]=c[j+3]}
  }
}
function fxGrain(d,w,h,a,kk,sd){
  const r=rng(sd^0x5bd1e995),amt=a*90;
  for(let by=0;by<h;by+=kk)for(let bx=0;bx<w;bx+=kk){
    const n=(r()-.5)*amt;
    for(let y=by;y<Math.min(h,by+kk);y++)for(let x=bx;x<Math.min(w,bx+kk);x++){const i=(y*w+x)*4;d[i]+=n;d[i+1]+=n;d[i+2]+=n}

function fxCRT(d,w,h,a,kk){

const anyStillFX=()=>FX.crt||FX.glitch||FX.ghost||FX.rgb||FX.grain;

/* ---------- Frame rendering ---------- */

}

function lzw(ix,mcs,push){

  emit(clear);

    if(c!==undefined){prefix=c;continue}

    else{if(next>=(1<<size))size++;dict.set(key,next++)}

}
class ByteOut{constructor(){this.chunks=[];this.buf=new Uint8Array(1<<16);this.n=0}
  b(v){if(this.n===this.buf.length){this.chunks.push(this.buf);this.buf=new Uint8Array(1<<16);this.n=0}this.buf[this.n++]=v}
  w(v){this.b(v&255);this.b((v>>8)&255)}
  s(t){for(const ch of t)this.b(ch.charCodeAt(0))}
  blob(){return new Blob([...this.chunks,this.buf.slice(0,this.n)],{type:"image/gif"})}}
async function makeGIF(progress){
  const ci=cycleInfo(),frames=ci.frames,fps=+$("fx-cycle").value,delay=Math.max(2,Math.round(100/fps));
  const cv=document.createElement("canvas");
  // pass 1: collect colors
  let colors=new Map(),overflow=false,hasT=false;
  for(let f=0;f<frames;f++){
    renderFrame(f,cv);const d=cv.getContext("2d").getImageData(0,0,cv.width,cv.height).data;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<128){hasT=true;continue}
      if(overflow)continue;
      const key=(d[i]<<16)|(d[i+1]<<8)|d[i+2];
      if(!colors.has(key)){colors.set(key,colors.size);if(colors.size>255)overflow=true}
    }
    progress(`Reading frame ${f+1} of ${frames}`);await new Promise(r=>setTimeout(r,0));
  }
  let pal;
  if(!overflow&&colors.size+(hasT?1:0)<=256){pal=[...colors.keys()].map(k2=>[k2>>16,(k2>>8)&255,k2&255])}
  else{
    renderFrame(0,cv);const h=buildHist(cv.getContext("2d").getImageData(0,0,cv.width,cv.height).data,255);
    const P=autoPalette(h,255);pal=[];for(let j=0;j<P.length/3;j++)pal.push([P[j*3],P[j*3+1],P[j*3+2]]);
  }
  const PF=new Float32Array(pal.length*3);pal.forEach((c,j)=>{PF[j*3]=c[0];PF[j*3+1]=c[1];PF[j*3+2]=c[2]});
  const tIndex=hasT?pal.length:-1,count=pal.length+(hasT?1:0);
  let bits=1;while((1<<bits)<count)bits++;
  const mcs=Math.max(2,bits),w=cv.width,h=cv.height;
  const o=new ByteOut();
  o.s("GIF89a");o.w(w);o.w(h);o.b(0x80|((bits-1)<<4)|(bits-1));o.b(0);o.b(0);
  for(let j=0;j<(1<<bits);j++){const c=pal[j]||[0,0,0];o.b(c[0]);o.b(c[1]);o.b(c[2])}
  if(frames>1){o.b(0x21);o.b(0xFF);o.b(11);o.s("NETSCAPE2.0");o.b(3);o.b(1);o.w(0);o.b(0)}
  const cache=new Map(),ix=new Uint8Array(w*h);
  for(let f=0;f<frames;f++){
    renderFrame(f,cv);const d=cv.getContext("2d").getImageData(0,0,w,h).data;
    for(let p=0,i=0;p<ix.length;p++,i+=4){
      if(d[i+3]<128){ix[p]=tIndex;continue}
      const key=(d[i]<<16)|(d[i+1]<<8)|d[i+2];let j=cache.get(key);
      if(j===undefined){j=nearest(PF,pal.length,d[i],d[i+1],d[i+2]);cache.set(key,j)}
      ix[p]=j;
    }
    o.b(0x21);o.b(0xF9);o.b(4);o.b(((hasT?2:1)<<2)|(hasT?1:0));o.w(delay);o.b(hasT?tIndex:0);o.b(0);
    o.b(0x2C);o.w(0);o.w(0);o.w(w);o.w(h);o.b(0);
    o.b(mcs);
    let block=[];
    lzw(ix,mcs,v=>{block.push(v);if(block.length===255){o.b(255);for(const x of block)o.b(x);block=[]}});
    if(block.length){o.b(block.length);for(const x of block)o.b(x)}
    o.b(0);
    progress(`Encoding frame ${f+1} of ${frames}`);await new Promise(r=>setTimeout(r,0));
  }
  o.b(0x3B);
  return o.blob();
}

/* ---------- Saving ---------- */
let downloads=null;
(async()=>{try{if(window.claude&&window.claude.use)downloads=await window.claude.use("downloads")}catch(e){}})();
async function offer(blob,filename){
  const hint=$("saveHint");hint.classList.remove("err");
  if(downloads){
    try{await downloads.save({filename,data:blob});hint.textContent="Saved "+filename}
    catch(e){hint.textContent=e&&e.code==="declined"?"Download cancelled.":"Download isn't available here. Right-click or long-press the picture to save it.";}
    return;
  }
  try{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    hint.textContent="If nothing downloaded, right-click or long-press the picture and save it.";
  }catch(e){hint.textContent="Right-click or long-press the picture to save it."}
}
const fileBase=()=>`${result.name}-${result.canvas.width}x${result.canvas.height}-${result.pal.length}c`;
$("save").addEventListener("click",()=>{
  if(!result)return;
  result.canvas.toBlob(blob=>offer(blob,fileBase()+".png"),"image/png");
});
$("saveGif").addEventListener("click",async()=>{
  if(!result||!base)return;
  const btn=$("saveGif"),hint=$("saveHint");btn.disabled=true;stopAnim();
  try{const blob=await makeGIF(t=>hint.textContent=t);await offer(blob,fileBase()+".gif")}
  catch(e){console.error(e);hint.textContent="The GIF couldn't be made: "+e.message}
  btn.disabled=false;refreshFrame(false);
});
async function copyText(t,msg){
  const hint=$("saveHint");
  try{await navigator.clipboard.writeText(t);hint.textContent=msg}
  catch(e){const ta=$("hexOut");ta.closest("details").open=true;ta.focus();ta.select();hint.textContent="Copy from the hex list in the palette panel."}
}
$("copyHex").addEventListener("click",()=>{if(result)copyText(result.pal.map(p=>p.hex).join("\n"),`Copied ${result.pal.length} hex codes`)});

buildPalTiles();
[...$("pxBtns").children].forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.k===k)));
updatePalUI();

})();

<script>
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('#tabs [role="tab"]'));
  function select(t, focus) {
    tabs.forEach(function (x) {
      var on = x === t;
      x.setAttribute("aria-selected", String(on));
      x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute("aria-controls")).hidden = !on;
    });
    if (focus) t.focus();
  }
  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { select(t); });
    t.addEventListener("keydown", function (e) {
      var k = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (k) { e.preventDefault(); select(tabs[(i + k + tabs.length) % tabs.length], true); }
    });
  });

  var about = document.getElementById("about"), aboutBtn = document.getElementById("aboutBtn");
  function closeAbout() { about.hidden = true; aboutBtn.focus(); }
  aboutBtn.addEventListener("click", function () { about.hidden = false; about.querySelector(".buttons button").focus(); });
  about.addEventListener("click", function (e) { if (e.target === about || e.target.closest("[data-close]")) closeAbout(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !about.hidden) closeAbout(); });

  var win = document.getElementById("appwin"), maxBtn = document.getElementById("maxBtn");

"1" fill="currentColor"/></svg>' };
  function toggleMax() {
    var on = win.classList.toggle("maximized");
    maxBtn.innerHTML = on ? GLYPH.restore : GLYPH.max;
    maxBtn.setAttribute("aria-label", on ? "Restore down" : "Maximize");
    document.getElementById("caption").title = on ? "Double-click to restore" : "Double-click to maximize";
    window.dispatchEvent(new Event("resize"));
  }
  maxBtn.addEventListener("click", toggleMax);
  document.getElementById("caption").addEventListener("dblclick", function (e) {
    if (e.target.closest(".win-ctl")) return;
    toggleMax();
  });
})();
