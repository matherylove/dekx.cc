<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dekxtopia emulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: #a39dc9; font: 16px "Lucida Console", monospace; text-align: center; padding: 12px; }
  .ejs_virtualGamepad_parent, .ejs_virtualGamepad, [class*="virtualGamepad"], [class*="nipple"] { display: none !important; }
  #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<div id="game"></div>
<script>
  // Only the ROMs that live next to this file can be loaded.
  var SYSTEMS = {
    "bios.bin": "segaCD",
    "bios.sfc": "snes",
    "bios.z64": "n64"
  };
  var rom = new URLSearchParams(location.search).get("rom");
  if (!SYSTEMS[rom]) {
    var m = document.createElement("div"); m.id = "msg"; m.textContent = "Unknown ROM."; document.body.appendChild(m);
  } else {
    window.EJS_player = "#game";
    window.EJS_core = SYSTEMS[rom];
    window.EJS_gameUrl = rom;
    window.EJS_gameName = rom;
    window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    window.EJS_startOnLoaded = true;
    window.EJS_color = "#a78bfa";
    window.EJS_backgroundColor = "#000000";
    window.EJS_volume = 0.5;
    var s = document.createElement("script");
    s.src = window.EJS_pathtodata + "loader.js";
    document.body.appendChild(s);
  }
</script>
</body>
</html>
